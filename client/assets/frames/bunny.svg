<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <ellipse cx="95" cy="55" rx="22" ry="48" fill="#1a1a1a" transform="rotate(-18 95 55)" filter="url(#soft)"/>
  <ellipse cx="161" cy="55" rx="22" ry="48" fill="#1a1a1a" transform="rotate(18 161 55)" filter="url(#soft)"/>
  <ellipse cx="95" cy="55" rx="22" ry="48" fill="#FFE8F0" transform="rotate(-18 95 55)"/>
  <ellipse cx="161" cy="55" rx="22" ry="48" fill="#FFE8F0" transform="rotate(18 161 55)"/>
  <ellipse cx="95" cy="58" rx="11" ry="34" fill="#FFB0C8" transform="rotate(-18 95 58)"/>
  <ellipse cx="161" cy="58" rx="11" ry="34" fill="#FFB0C8" transform="rotate(18 161 58)"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#2a2a32" stroke-width="8"/>
</svg>