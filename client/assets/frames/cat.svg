<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <!-- left ear -->
  <path d="M78 95 L92 22 L122 92 Z" fill="#1a1a1a" filter="url(#soft)"/>
  <path d="M84 90 L96 36 L116 90 Z" fill="#FFB6C8"/>
  <path d="M90 88 L98 48 L110 88 Z" fill="#FFD0DC"/>
  <!-- right ear -->
  <path d="M178 95 L164 22 L134 92 Z" fill="#1a1a1a" filter="url(#soft)"/>
  <path d="M172 90 L160 36 L140 90 Z" fill="#FFB6C8"/>
  <path d="M166 88 L158 48 L146 88 Z" fill="#FFD0DC"/>
  <!-- rim highlight over ears base -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="#2a2a32" stroke-width="6"/>
  <circle cx="128" cy="140" r="68" fill="none" stroke="#555" stroke-width="1.5" opacity="0.4"/>
</svg>