<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <path d="M128 38 C128 38 95 75 90 110" fill="none" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 38 C128 38 160 75 165 110" fill="none" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="125" r="30" fill="#B91C1C" filter="url(#soft)"/>
  <circle cx="165" cy="125" r="30" fill="#B91C1C" filter="url(#soft)"/>
  <circle cx="90" cy="125" r="30" fill="#EF4444"/>
  <circle cx="165" cy="125" r="30" fill="#EF4444"/>
  <circle cx="80" cy="112" r="8" fill="#FECACA" opacity="0.7"/>
  <circle cx="155" cy="112" r="8" fill="#FECACA" opacity="0.7"/>
  <circle cx="128" cy="165" r="55" fill="none" stroke="#B91C1C" stroke-width="6"/>
</svg>