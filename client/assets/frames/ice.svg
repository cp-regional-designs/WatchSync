<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <path d="M128 25 L138 65 L128 85 L118 65 Z" fill="#A5F3FC" stroke="#0E7490" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M55 75 L95 95 L100 120 L60 115 Z" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M201 75 L161 95 L156 120 L196 115 Z" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M65 195 L100 165 L115 175 L85 205 Z" fill="#A5F3FC" stroke="#0E7490" stroke-width="1.5"/>
  <path d="M191 195 L156 165 L141 175 L171 205 Z" fill="#A5F3FC" stroke="#0E7490" stroke-width="1.5"/>
  <circle cx="128" cy="140" r="70" fill="none" stroke="#22D3EE" stroke-width="6"/>
  <circle cx="128" cy="140" r="66" fill="none" stroke="#A5F3FC" stroke-width="2" opacity="0.6"/>
</svg>