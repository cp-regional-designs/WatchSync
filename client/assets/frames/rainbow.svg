<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <path d="M50 135 A78 78 0 0 1 206 135" fill="none" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
  <path d="M58 135 A70 70 0 0 1 198 135" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 135 A62 62 0 0 1 190 135" fill="none" stroke="#EAB308" stroke-width="7" stroke-linecap="round"/>
  <path d="M74 135 A54 54 0 0 1 182 135" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round"/>
  <path d="M82 135 A46 46 0 0 1 174 135" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
  <path d="M90 135 A38 38 0 0 1 166 135" fill="none" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="155" r="58" fill="none" stroke="#2a2a32" stroke-width="8"/>
</svg>