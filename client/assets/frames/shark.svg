<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <path d="M128 25 L162 100 L94 100 Z" fill="#4B5563" filter="url(#soft)"/>
  <path d="M128 25 L162 100 L94 100 Z" fill="#6B7280"/>
  <path d="M128 40 L150 95 L106 95 Z" fill="#9CA3AF"/>
  <circle cx="128" cy="145" r="70" fill="none" stroke="#4B5563" stroke-width="8"/>
  <circle cx="128" cy="145" r="66" fill="none" stroke="#9CA3AF" stroke-width="2" opacity="0.5"/>
</svg>