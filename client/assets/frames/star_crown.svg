<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">

  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- avatar hole (transparent center) -->
  <circle cx="128" cy="140" r="72" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#3d3d4a" stroke-width="2" opacity="0.8"/>

  <path d="M128 22 L136 48 L164 48 L142 64 L150 90 L128 72 L106 90 L114 64 L92 48 L120 48 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2" filter="url(#soft)"/>
  <path d="M68 48 L74 64 L92 64 L78 74 L84 90 L68 78 L52 90 L58 74 L44 64 L62 64 Z" fill="#FF69B4" stroke="#C71585" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M188 48 L194 64 L212 64 L198 74 L204 90 L188 78 L172 90 L178 74 L164 64 L182 64 Z" fill="#87CEEB" stroke="#4682B4" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="128" cy="48" r="5" fill="#FFF8DC"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#B8860B" stroke-width="7"/>
  <circle cx="128" cy="140" r="68" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
</svg>