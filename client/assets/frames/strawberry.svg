  <path d="M100 48 C110 28 128 25 128 25 C128 25 146 28 156 48 C142 45 128 55 128 55 C128 55 114 45 100 48 Z" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="105" cy="95" r="3.5" fill="#FECACA"/><circle cx="145" cy="110" r="3.5" fill="#FECACA"/>
  <circle cx="120" cy="130" r="3" fill="#FECACA"/><circle cx="150" cy="90" r="3" fill="#FECACA"/>
  <circle cx="128" cy="155" r="58" fill="none" stroke="#E11D48" stroke-width="6"/>
</svg>